name: Freqtrade Validation

on:
  push:
    paths:
      - 'implementation/**'
      - '!implementation/config/c6a_source_authority_query_inventory_v1.json'
      - '!implementation/src/atos/c6a_source_authority*.py'
      - '!implementation/tests/test_c6a_source_authority*.py'
      - '!implementation/scripts/run_c6a_source_authority_gate.py'
  pull_request:
    paths:
      - 'implementation/**'
      - '!implementation/config/c6a_source_authority_query_inventory_v1.json'
      - '!implementation/src/atos/c6a_source_authority*.py'
      - '!implementation/tests/test_c6a_source_authority*.py'
      - '!implementation/scripts/run_c6a_source_authority_gate.py'
  workflow_dispatch:
    inputs:
      c13a_h1_h5_authoritative:
        description: 'Run the one-shot frozen C13A H1-H5 public-data authority'
        required: false
        default: false
        type: boolean

jobs:
  atos-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install ATOS
        run: |
          cd implementation
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run pytest
        run: |
          cd implementation
          set -o pipefail; python -m pytest -v --tb=long 2>&1 | tee pytest.log
      - name: Secret leakage scan
        run: |
          cd implementation
          set -o pipefail; bash scripts/validate_no_secrets.sh 2>&1 | tee no_secret_scan.log
      - name: Generate evidence manifest (atos-tests)
        run: |
          cd implementation
          python scripts/generate_evidence_manifest.py atos-tests
      - name: CLI smoke test
        run: |
          cd implementation
          python -m atos.cli status; python -m atos.cli risk; python -m atos.cli cycle
          python -m atos.cli review; python -m atos.cli_ext evaluate
      - name: Walk-forward report
        run: |
          cd implementation && mkdir -p freqtrade_data/backtest_results
          python3 scripts/ci_walk_forward.py
      - name: Preflight evidence atos-tests
        run: |
          cd implementation
          python scripts/preflight_evidence_artifact.py atos-tests
      - name: Upload ATOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atos-validation
          path: |
            implementation/evidence_manifest.json
            implementation/pytest.log
            implementation/no_secret_scan.log
            implementation/freqtrade_data/backtest_results/walk_forward_report.json
          retention-days: 14

  freqtrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libssl-dev
          cd implementation
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,freqtrade]'
          python -c "import freqtrade; print('Freqtrade', freqtrade.__version__)"
      - name: Setup Freqtrade
        run: |
          cd implementation
          bash scripts/setup_freqtrade.sh
          cp config/policy.validation.json config/policy.json
      - name: List strategies
        run: |
          cd implementation
          freqtrade list-strategies --strategy-path freqtrade_data/strategies 2>&1 | tee freqtrade_list_strategies.log
          grep -q "AISupervisedStrategy" freqtrade_list_strategies.log && echo "AISupervisedStrategy found" || echo "AISupervisedStrategy NOT found"
      - name: Download OKX data
        timeout-minutes: 15
        continue-on-error: true
        run: |
          cd implementation && mkdir -p freqtrade_data/data/okx
          freqtrade download-data --config freqtrade_data/config.dryrun.json --datadir freqtrade_data/data/okx --exchange okx --pairs BTC/USDT --timeframes 5m --timerange 20250101-20250701 2>&1 | tee download_data.log
          ls freqtrade_data/data/okx/ || echo "(no data)"
      - name: Production-path safety test (required)
        run: |
          cd implementation
          python -m pytest tests/test_no_lookahead_strategy.py::test_resolve_candle_ts_reads_only_current_row_production_path -v --no-header -s
      - name: Generate evidence manifest (freqtrade)
        run: |
          cd implementation
          python scripts/generate_evidence_manifest.py freqtrade
      - name: Canonical fresh baseline
        run: |
          cd implementation
          python3 scripts/run_canonical_backtest.py canonical_baseline canonical_baseline config/policy.validation.json
          RUN_LOOKAHEAD=1 python3 scripts/run_canonical_backtest.py canonical_baseline_la canonical_baseline_la config/policy.validation.json
      - name: Multi-period + baseline + multi-pair + attribution
        if: always()
        continue-on-error: true
        env: {ATOS_POLICY: config/policy.validation.json}
        run: |
          cd implementation && mkdir -p validation_reports
          python3 scripts/ci_multi_period.py
          python3 scripts/ci_baselines.py
          python3 scripts/ci_multipair_attribution.py
      - name: Validate pair format
        if: always()
        run: |
          cd implementation
          python3 -c "
          import json; cfg = json.load(open('freqtrade_data/config.dryrun.json'))
          pairs = cfg.get('exchange',{}).get('pair_whitelist',[])
          for p in pairs:
              if ':USDT' in p: print(f'ERROR: {p}'); exit(1)
              print(f'OK: {p}')
          print('Pair format validated.')
          " 2>&1 | tee pair_format_check.log
      - name: Strategy Fix Round 1 (canonical)
        timeout-minutes: 180
        run: |
          cd implementation
          mkdir -p validation_reports
          python3 scripts/ci_strategy_fix_round1.py
      - name: Preflight evidence freqtrade
        run: |
          cd implementation
          python scripts/preflight_evidence_artifact.py freqtrade
      - name: Upload Freqtrade artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-validation
          path: |
            implementation/evidence_manifest.json
            implementation/freqtrade_data/backtest_results/canonical_baseline_summary.json
            implementation/freqtrade_data/backtest_results/canonical_baseline_la_lookahead_status.json
            implementation/validation_reports/strategy_fix_round1.json
            implementation/validation_reports/strategy_fix_round1.md
            implementation/freqtrade_data/backtest_results/round1_*_la_lookahead_status.json
          if-no-files-found: error

  c13a-h1-h5-authoritative:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.c13a_h1_h5_authoritative == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    concurrency:
      group: c13a-h1-h5-authoritative
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install frozen C13A runtime
        run: |
          cd implementation
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          mkdir -p c13a_authority
          python -m pip freeze --all > c13a_authority/python_environment.txt
      - name: Verify exact clean main checkout
        env:
          IMPLEMENTATION_SHA: ${{ github.sha }}
        run: |
          cd implementation
          python -c "from pathlib import Path; from atos.c13a_historical_run_guard import verify_checkout_binding; print(verify_checkout_binding('${IMPLEMENTATION_SHA}', repository_root=Path('..')))"
      - name: Capture official-public OKX H1-H5 data
        env:
          IMPLEMENTATION_SHA: ${{ github.sha }}
        run: |
          cd implementation
          mkdir -p c13a_authority
          set -o pipefail
          python scripts/c13a_h1_h5_capture.py \
            --output c13a_authority/capture \
            --implementation-sha "${IMPLEMENTATION_SHA}" \
            2>&1 | tee c13a_authority/capture.log
      - name: Replay, independently recompute, and classify once
        env:
          IMPLEMENTATION_SHA: ${{ github.sha }}
          AUTHORITATIVE_RUN_ID: ${{ github.run_id }}
        run: |
          cd implementation
          set +e
          set -o pipefail
          python scripts/c13a_h1_h5_evaluate.py \
            --capture c13a_authority/capture \
            --output c13a_authority/evidence \
            --implementation-sha "${IMPLEMENTATION_SHA}" \
            --authoritative-run-id "${AUTHORITATIVE_RUN_ID}" \
            2>&1 | tee c13a_authority/evaluate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -gt 1 ]; then exit "${status}"; fi
      - name: Publish C13A classification summary
        if: always() && hashFiles('implementation/c13a_authority/evidence/final_classification.json') != ''
        run: |
          cd implementation
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("c13a_authority/evidence")
          final = json.loads((root / "final_classification.json").read_text())
          pooled = json.loads((root / "pooled_summary.json").read_text())
          candidate = pooled["pooled"]["C13ACrossSectionalLotteryDemandReversal"]["1.0x"]
          lines = [
              "# C13A H1-H5 authority",
              f"- Classification: `{final['classification']}`",
              f"- Exact implementation SHA: `{final['implementation_sha']}`",
              f"- Independent recomputation: `{final['independent_recompute_passed']}`",
              f"- Aggregate return, 1.0x cost: `{candidate['aggregate_return']}`",
              f"- Annualized weekly Sharpe: `{candidate['statistics']['annualized_weekly_sharpe']}`",
              f"- Weekly PSR: `{candidate['statistics']['psr_probability']}`",
              f"- Bonferroni-adjusted PSR: `{candidate['bonferroni_adjusted_psr']}`",
              f"- Candidate BTC beta: `{pooled['candidate_btc_beta']}`",
              "- Failed gates: " + ", ".join(pooled["rejection_reasons"]),
              "- Account/private/order/Paper/Shadow/Live side effects: `NONE`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Seal complete C13A authority artifact inventory
        if: always()
        env:
          IMPLEMENTATION_SHA: ${{ github.sha }}
          AUTHORITATIVE_RUN_ID: ${{ github.run_id }}
        run: |
          cd implementation
          python scripts/c13a_h1_h5_artifact_manifest.py \
            --root c13a_authority \
            --implementation-sha "${IMPLEMENTATION_SHA}" \
            --authoritative-run-id "${AUTHORITATIVE_RUN_ID}"
      - name: Upload immutable C13A authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c13a-h1-h5-authoritative-${{ github.run_id }}
          path: implementation/c13a_authority
          if-no-files-found: warn
          retention-days: 30

  validation-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [atos-tests, freqtrade]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd implementation
          python -m pip install -e '.[dev,freqtrade]'
      - uses: actions/download-artifact@v4
        with:
          name: atos-validation
          path: atos_artifacts
      - uses: actions/download-artifact@v4
        with:
          name: freqtrade-validation
          path: freqtrade_artifacts
      - name: Verify same-run CI equivalence
        env:
          SIMPLE_CI_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SIMPLE_CI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SIMPLE_CI_EVENT: ${{ github.event_name }}
          ATOS_JOB_RESULT: ${{ needs.atos-tests.result }}
        run: |
          cd implementation
          python - <<'PY'
          import os
          from atos.evidence_summary import write_json_atomic
          from atos.simple_ci_equivalence import verify_same_run_ci_equivalence

          pr_number = os.environ.get("SIMPLE_CI_PR_NUMBER", "").strip()
          result = verify_same_run_ci_equivalence(
              ci_workflow_path="../.github/workflows/ci.yml",
              validation_workflow_path="../.github/workflows/freqtrade-validation.yml",
              atos_manifest_path="../atos_artifacts/evidence_manifest.json",
              head_sha=os.environ["GITHUB_SHA"],
              run_id=os.environ["GITHUB_RUN_ID"],
              atos_result=os.environ["ATOS_JOB_RESULT"],
              event_name=os.environ["SIMPLE_CI_EVENT"],
              pr_number=int(pr_number) if pr_number else None,
              run_head_sha=os.environ["SIMPLE_CI_RUN_HEAD_SHA"],
          )
          write_json_atomic("simple_ci_evidence.json", result)
          print("Same-run CI equivalence verified: source_job=" + result["source_job"])
          PY
      - name: Run evidence summary
        run: |
          cd implementation
          python -m atos.evidence_summary "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${{ needs.atos-tests.result }}" "${{ needs.freqtrade.result }}" ../atos_artifacts ../freqtrade_artifacts simple_ci_evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: |
            implementation/validation_summary.json
            implementation/validation_summary.md
          if-no-files-found: error

  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    needs: [atos-tests, freqtrade, validation-summary]
    if: ${{ always() }}
    steps:
      - name: Send retained PR completion notification
        continue-on-error: true
        env:
          MESSAGE_PUSH_ENDPOINT: ${{ secrets.MESSAGE_PUSH_ENDPOINT }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATOS_RESULT: ${{ needs.atos-tests.result }}
          FREQTRADE_RESULT: ${{ needs.freqtrade.result }}
          SUMMARY_RESULT: ${{ needs.validation-summary.result }}
        run: |
          set +e
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Notification suppressed for non-PR event: ${EVENT_NAME}."
            exit 0
          fi

          if [ -z "${MESSAGE_PUSH_ENDPOINT}" ]; then
            echo "MESSAGE_PUSH_ENDPOINT is not configured; notification skipped."
            exit 0
          fi

          if [ "${ATOS_RESULT}" = "failure" ] || \
             [ "${FREQTRADE_RESULT}" = "failure" ] || \
             [ "${SUMMARY_RESULT}" = "failure" ]; then
            status="FAILURE"
          elif [ "${ATOS_RESULT}" = "cancelled" ] || \
             [ "${FREQTRADE_RESULT}" = "cancelled" ] || \
             [ "${SUMMARY_RESULT}" = "cancelled" ]; then
            status="CANCELLED"
          elif [ "${ATOS_RESULT}" = "skipped" ] || \
               [ "${FREQTRADE_RESULT}" = "skipped" ] || \
               [ "${SUMMARY_RESULT}" = "skipped" ]; then
            status="SKIPPED"
          elif [ "${ATOS_RESULT}" = "success" ] && \
               [ "${FREQTRADE_RESULT}" = "success" ] && \
               [ "${SUMMARY_RESULT}" = "success" ]; then
            status="SUCCESS"
          else
            status="FAILURE"
          fi

          body="PR #${PR_NUMBER} | ${status} | SHA ${PR_HEAD_SHA} | Run ID ${RUN_ID} | ATOS ${ATOS_RESULT} | Freqtrade ${FREQTRADE_RESULT} | Summary ${SUMMARY_RESULT}"
          curl --fail --silent --show-error --max-time 20 --get \
            "${MESSAGE_PUSH_ENDPOINT}" \
            --data-urlencode "title=ATOS · Freqtrade Validation 完成" \
            --data-urlencode "message=${body}" \
            --data-urlencode "sound=1" \
            --output /dev/null || true
